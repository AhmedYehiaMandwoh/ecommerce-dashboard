name: Verify non-live source
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: ghiyar
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-ci-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:local-ci-only@127.0.0.1:3306/ghiyar
      NODE_ENV: test
      OTP_MODE: static-test
      SMS_SEND_ENABLED: 'false'
      TEST_CHECKOUT: 'true'
      ALLOW_DEMO_SEED: 'true'
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build:api
      - run: npm test
      - run: npm run typecheck -w apps/web
      - run: npm run build:web
      - run: npm run db:migrate -w apps/api
      - name: Seed disposable test database
        run: |
          echo "DEMO_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm run db:seed -w apps/api
      - name: Integration checks
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4000/api/health && break || sleep 1; done
          npm run test:integration -w apps/api
